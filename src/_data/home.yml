intro:
  label: My —
  heading: HOLISTIC PRACTICE OSTEOPATHY
  image: /images/portret-1.jpg
  text: |-
    "Osteopatia to dla mnie znacznie więcej niż zawód. To pasja, nieustanne poszerzanie wiedzy i zaangażowanie w poszukiwaniu najlepszych rozwiązań dla pacjentów. W swojej pracy łączę wiedzę medyczną, doświadczenie i szacunek dla indywidualności każdego organizmu.

    Wierzę, że prawdziwy profesjonalizm zaczyna się od uważnego słuchania, zrozumienia i spojrzenia na człowieka jako całość."
  quote: „To find health should be the object of the doctor. Anyone can find disease.”
  quote_author: Andrew Taylor Still
services_section:
  heading: PHILOSOPHY
